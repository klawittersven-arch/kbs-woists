<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="author" content="Sven Klawitter">
<meta name="theme-color" content="#0d1030">
<title>Mitspielen · KBS Wo ist’s? Anatomie!</title>
<link rel="icon" href="img/logo.png">
<link rel="stylesheet" href="css/woists.css">
</head>
<body class="handy">
<main class="app">
  <header class="top">
    <h1 class="brand">KBS Wo ist’s? <span>Anatomie!</span></h1>
    <div class="tools">
      <span class="netdot" id="netdot" data-s="offline" title="Verbindung"></span>
    </div>
  </header>

  <section class="panel" id="panel" aria-live="polite">
    <div class="card"><h2>Verbinde …</h2><p>Einen Moment, die Klasse wird gesucht.</p></div>
  </section>

  <section class="spielfeld" id="spielfeld" hidden>
    <div class="sinfo" id="sInfo"></div>
    <div class="frage" id="frage" aria-live="polite"></div>
    <div class="zeitbalken" id="sBarBox"><i id="sBar"></i></div>
    <div class="spielbild"><div id="figur"></div><button class="weiter" id="btnWeiter" hidden>Weiter →</button></div>
  </section>

  <div class="countdown" id="countdown" hidden><div><b id="cdNum">3</b><small id="cdText"></small></div></div>
  <div class="toast" id="toast" role="status" hidden></div>
</main>
<script type="module" src="js/mitspielen.js"></script>
</body>
</html>
